name: Lightweight CI
on:
  push:
    branches:
      - "feat/**"
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Emit generated lockfile for repository bootstrap
        run: node -e "console.log('PNPM_LOCKFILE_BASE64=' + require('node:fs').readFileSync('pnpm-lock.yaml').toString('base64'))"
      - run: pnpm typecheck
      - run: pnpm test
